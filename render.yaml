services:
  - type: web
    name: motrix-python-service
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free

  - type: web
    name: motrix-laravel-app
    env: php
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: php artisan migrate --force && apache2-foreground
    plan: free
    envVars:
      - key: APP_KIND
        value: laravel
      - key: PYTHON_SERVICE_URL
        fromService:
          name: motrix-python-service
          type: web
          property: host
